version: "4.4"

services:
    rabbitmq:
        image: rabbitmq:management
        container_name: rabbitmq-net-messenger
        ports:
            - "5673:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
        env_file: .env

    postgres:
        image: postgres
        container_name: postgres-net-messenger
        ports:
            - "5433:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        env_file: .env
